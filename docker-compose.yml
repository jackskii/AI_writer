version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: novel_ai_db
      POSTGRES_USER: novel_user
      POSTGRES_PASSWORD: novel_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://novel_user:novel_password@postgres:5432/novel_ai_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8001/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: